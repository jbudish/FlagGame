<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flag Game">
<meta name="theme-color" content="#1e88e5">
<title>Flag Game</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif;background:#1e88e5;color:#fff}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}
button{font-family:inherit;border:none;cursor:pointer;color:#fff}
button:active{transform:scale(.94)}
/* HOME */
#home{flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;
  background:linear-gradient(160deg,#42a5f5,#1565c0);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));text-align:center}
#home h1{font-size:min(11vh,9vw);text-shadow:0 4px 0 rgba(0,0,0,.2);line-height:1.1}
.stats{display:flex;gap:4vw;align-items:stretch}
.stat{background:rgba(255,255,255,.18);border-radius:24px;padding:1.5vh 4vw;min-width:28vw}
.stat .n{font-size:min(16vh,13vw);font-weight:bold;line-height:1}
.stat .l{font-size:min(5vh,4vw);opacity:.95;margin-top:.5vh}
.stat.star .n{color:#ffeb3b;text-shadow:0 3px 0 rgba(0,0,0,.2)}
#start{background:#43a047;font-size:min(10vh,8vw);font-weight:bold;padding:2vh 9vw;border-radius:999px;box-shadow:0 8px 0 #2e7d32;letter-spacing:1px}
#start:active{box-shadow:0 3px 0 #2e7d32;transform:translateY(5px)}
#reset{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));right:max(14px,env(safe-area-inset-right));background:rgba(0,0,0,.2);font-size:14px;padding:8px 14px;border-radius:999px;opacity:.75}
/* GAME */
#game{background:#263238;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#flagArea{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-width:0}
#flag{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
#flag.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#close{position:absolute;top:8px;left:8px;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);font-size:30px;font-weight:bold;line-height:56px;z-index:5;border:3px solid rgba(255,255,255,.8)}
#name{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(255,255,255,.96);color:#0d47a1;font-weight:bold;
  font-size:min(9vh,6vw);padding:.6vh 4vw;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;display:none;z-index:4}
#name.show{display:block;animation:pop .3s ease-out}
#side{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:10px 10px 10px 0;width:min(30vh,24vw);min-width:96px}
#side button{flex:1;border-radius:22px;font-size:min(14vh,11vw);font-weight:bold;display:flex;align-items:center;justify-content:center;line-height:1}
#yes{background:#43a047;box-shadow:inset 0 -6px 0 #2e7d32}
#ask{background:#ffb300;box-shadow:inset 0 -6px 0 #ff8f00}
#no{background:#e53935;box-shadow:inset 0 -6px 0 #b71c1c}
#side button svg{width:60%;height:60%}
.busy #side button{pointer-events:none}
/* celebration */
.burst{position:fixed;font-size:44px;pointer-events:none;z-index:20;will-change:transform,opacity;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
#bigstar{position:fixed;left:50%;top:50%;font-size:min(40vh,30vw);transform:translate(-50%,-50%) scale(0);z-index:19;pointer-events:none}
#bigstar.go{animation:star .8s ease-out}
@keyframes star{0%{transform:translate(-50%,-50%) scale(0)}40%{transform:translate(-50%,-50%) scale(1.1)}70%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* rotate prompt */
#rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:linear-gradient(160deg,#7e57c2,#4527a0);text-align:center;padding:30px}
#rotate .phone{width:90px;height:150px;border:8px solid #fff;border-radius:20px;position:relative;animation:turn 2s ease-in-out infinite}
#rotate .phone:after{content:"";position:absolute;bottom:8px;left:50%;width:22px;height:6px;margin-left:-11px;border-radius:3px;background:#fff}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate p{font-size:30px;font-weight:bold;line-height:1.3}
#rotate small{font-size:18px;opacity:.85}
@media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="home" class="screen on">
  <h1>🌍 Flag Game</h1>
  <div class="stats">
    <div class="stat star"><div class="n" id="score">0</div><div class="l">⭐ Flags I knew</div></div>
    <div class="stat"><div class="n" id="played">0</div><div class="l">🏳️ Flags played</div></div>
  </div>
  <button id="start">▶ Start</button>
  <button id="reset">Reset score</button>
</div>
<div id="game" class="screen">
  <div id="flagArea">
    <button id="close" aria-label="Back to home">✕</button>
    <img id="flag" alt="Country flag" draggable="false">
    <div id="name"></div>
  </div>
  <div id="side">
    <button id="yes" aria-label="I knew it"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="ask" aria-label="Say the country name">?</button>
    <button id="no" aria-label="Didn't know it"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg></button>
  </div>
</div>
<div id="bigstar">⭐</div>
<div id="rotate"><div class="phone"></div><p>Turn your phone sideways!</p><small>The flag game works best this way ↻</small></div>

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('flaggame.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('flaggame.'+k,JSON.stringify(v))}catch(e){}}};
let score=store.get('score',0),played=store.get('played',0),deck=store.get('deck',null),pos=store.get('pos',0),cur=null,busy=false;
function shuffle(){const a=COUNTRIES.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
if(!Array.isArray(deck)||deck.length!==COUNTRIES.length){deck=shuffle();pos=0}
function save(){store.set('score',score);store.set('played',played);store.set('deck',deck);store.set('pos',pos)}
function renderHome(){$('score').textContent=score;$('played').textContent=played}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function nextFlag(){
  if(pos>=deck.length){const last=deck[deck.length-1];deck=shuffle();if(deck[0]===last){deck.push(deck.shift())}pos=0}
  cur=COUNTRIES[deck[pos]];pos++;save();
  const img=$('flag');img.classList.remove('pop');void img.offsetWidth;
  img.src=FLAGS[cur.code];img.classList.add('pop');
  $('name').classList.remove('show');$('name').textContent=cur.name;
}
// audio
let actx=null;
function chime(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const t=actx.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.25,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.45);
  o.connect(g).connect(actx.destination);o.start(t+i*.09);o.stop(t+i*.09+.5)})}catch(e){}}
function burst(){const em=['⭐','🎉','✨','🌟','🎈','💛'];const r=$('flagArea').getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<18;i++){const s=document.createElement('div');s.className='burst';s.textContent=em[i%em.length];
    const a=Math.random()*Math.PI*2,d=120+Math.random()*Math.min(innerWidth,innerHeight)*.5;
    s.style.left=(cx-22)+'px';s.style.top=(cy-22)+'px';s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}
  const b=$('bigstar');b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}
// speech
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|google|natural/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-US';u.rate=.85;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
function lock(ms){busy=true;document.body.classList.add('busy');setTimeout(()=>{busy=false;document.body.classList.remove('busy')},ms)}
function tap(el,fn){el.addEventListener('click',e=>{e.preventDefault();fn()})}
tap($('start'),()=>{show('game');nextFlag();lock(300)});
tap($('close'),()=>{if('speechSynthesis' in window)speechSynthesis.cancel();renderHome();show('home')});
tap($('ask'),()=>{if(!cur)return;$('name').classList.add('show');say(cur.say||cur.name)});
tap($('yes'),()=>{if(busy||!cur)return;score++;played++;save();chime();burst();lock(800);setTimeout(nextFlag,650)});
tap($('no'),()=>{if(busy||!cur)return;played++;save();lock(350);nextFlag()});
tap($('reset'),()=>{if(confirm('Reset the score back to 0?\n\n(Grown-ups only!)')){score=0;played=0;deck=shuffle();pos=0;save();renderHome()}});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
renderHome();
</script>
